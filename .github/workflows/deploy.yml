name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          script: |
            cd /root/tds-simulator
            git pull origin main
            docker stop tds-simulator || true
            docker rm tds-simulator || true
            docker rmi tds-simulator || true
            docker build -t tds-simulator .
            docker run -d --name tds-simulator --restart always -p 127.0.0.1:9300:80 tds-simulator
            echo "✅ Deployed at $(date)"
